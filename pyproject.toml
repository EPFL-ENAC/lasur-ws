[project]
name = "api"
version = "0.4.1"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115.8",
  "uvicorn>=0.34.0",
  "pydantic-settings>=2.8.0",
  "redis>=6.4.0",
  # "typo-modal @ git+https://github.com/EPFL-LASUR/mobility-toolkit.git@v0.2.6",
  "typo-modal @ git+ssh://git@github.com/EPFL-LASUR/mobility-toolkit.git@v0.2.6",
  "isochrones @ git+https://github.com/EPFL-ENAC/isochrones.git@v0.5.0",
  "extractosm @ git+https://github.com/EPFL-ENAC/extractosm.git@v0.1.2",
]
description = "LASUR Web Services"
authors = [{ name = "Yannick Marcon", email = "yannick.marcon@epfl.ch" }]
license = "GPLv3"
readme = "README.md"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
